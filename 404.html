<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이동합니다 — LIVE translate</title>
<!-- JS가 꺼져 있으면 최소한 새 사이트 루트로 이동 -->
<meta http-equiv="refresh" content="1; url=https://gsjang-hue.github.io/LIVE-Translate/">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: #0a1410; color: #e8efe8; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; }
  .box { max-width: 440px; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 20px; border: 3px solid #1e3a2a; border-top-color: #30d158; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; color: #fff; margin-bottom: 10px; }
  p { font-size: 14px; color: #8aa08a; line-height: 1.7; margin-bottom: 18px; }
  a.btn { display: inline-block; font-size: 14px; font-weight: 600; color: #0a1400; background: #30d158; border-radius: 8px; padding: 10px 18px; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>주소가 변경되었습니다</h1>
    <p><b style="color:#30d158;">LIVE translate</b> 새 주소로 이동 중입니다…</p>
    <a class="btn" id="go" href="https://gsjang-hue.github.io/LIVE-Translate/">여기를 눌러 이동</a>
  </div>
  <script>
    // 예전 저장소의 어떤 경로로 들어와도 새 저장소의 같은 경로로 넘긴다.
    (function () {
      var NEW = 'https://gsjang-hue.github.io/LIVE-Translate/';
      var p = location.pathname;
      // /Gemini-Translate/ 접두어 제거(대소문자 무시)
      p = p.replace(/^\/Gemini-Translate\//i, '');
      // 접두어가 없던 경우(직접 파일명만 등) 앞 슬래시 제거
      p = p.replace(/^\//, '');
      // 매뉴얼 PDF 파일명이 바뀌었으므로 매핑
      p = p.replace('gemini_translate_manual.pdf', 'live_translate_manual.pdf');
      var target = NEW + p + location.search + location.hash;
      document.getElementById('go').href = target || NEW;
      location.replace(target || NEW);
    })();
  </script>
</body>
</html>
