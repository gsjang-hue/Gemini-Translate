<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이동합니다 — LIVE translate</title>
<link rel="canonical" href="https://gsjang-hue.github.io/LIVE-Translate/">
<!-- JS가 꺼져 있어도 자동 이동 -->
<meta http-equiv="refresh" content="0; url=https://gsjang-hue.github.io/LIVE-Translate/">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: #0a1410; color: #e8efe8; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5rem; }
  .box { max-width: 440px; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 20px; border: 3px solid #1e3a2a; border-top-color: #30d158; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; color: #fff; margin-bottom: 10px; }
  p { font-size: 14px; color: #8aa08a; line-height: 1.7; margin-bottom: 18px; }
  a.btn { display: inline-block; font-size: 14px; font-weight: 600; color: #0a1400; background: #30d158; border-radius: 8px; padding: 10px 18px; text-decoration: none; }
  .url { font-size: 12px; color: #5a6a5a; margin-top: 16px; word-break: break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>주소가 변경되었습니다</h1>
    <p><b style="color:#30d158;">LIVE translate</b> 새 주소로 이동 중입니다…</p>
    <a class="btn" href="https://gsjang-hue.github.io/LIVE-Translate/">자동 이동이 안 되면 여기를 눌러주세요</a>
    <div class="url">https://gsjang-hue.github.io/LIVE-Translate/</div>
  </div>
  <script>
    // 즉시 이동(뒤로가기 루프 방지를 위해 replace 사용)
    location.replace('https://gsjang-hue.github.io/LIVE-Translate/');
  </script>
</body>
</html>
